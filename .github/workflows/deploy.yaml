name: Deploy (ECS Blue/Green)

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "134051051665"
  ECR_REPO_URI: "134051051665.dkr.ecr.us-east-1.amazonaws.com/ecs-bluegreen-app"
  CODEDEPLOY_APP: "ecs-bluegreen-codedeploy-app"
  CODEDEPLOY_DG: "ecs-bluegreen-dg"
  CODEDEPLOY_BUCKET: "codedeploy-revisions-123456"
  ALB_BASE_URL: "http://ecs-bluegreen-alb-769268363.us-east-1.elb.amazonaws.com"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::134051051665:role/ecs-bluegreen-github-actions"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tag = commit SHA)
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t app:${IMAGE_TAG} ecs-cicd-bluegreen/app
          docker tag app:${IMAGE_TAG} ${ECR_REPO_URI}:${IMAGE_TAG}
          docker push ${ECR_REPO_URI}:${IMAGE_TAG}

      - name: Render taskdef.json (update image + APP_VERSION)
        run: |
          python - << 'PY'
          import json, os

          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["ECR_REPO_URI"]
          base_path = "ecs-cicd-bluegreen/deploy/taskdef.json"

          with open(base_path) as f:
            td = json.load(f)

          # Remove keys that are not accepted by ecs register-task-definition
          for k in [
            "taskDefinitionArn", "revision", "status", "requiresAttributes",
            "compatibilities", "registeredAt", "registeredBy", "tags"
          ]:
            td.pop(k, None)

          # Update container image
          td["containerDefinitions"][0]["image"] = f"{repo}:{sha}"

          # Update APP_VERSION
          envs = td["containerDefinitions"][0].get("environment", [])
          found = False
          for item in envs:
            if item.get("name") == "APP_VERSION":
              item["value"] = sha[:12]
              found = True
          if not found:
            envs.append({"name": "APP_VERSION", "value": sha[:12]})
          td["containerDefinitions"][0]["environment"] = envs

          with open("taskdef.rendered.json", "w") as f:
            json.dump(td, f, indent=2)

          print("Rendered taskdef.rendered.json (sanitized)")
          PY

      - name: Register new ECS task definition revision
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.rendered.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASKDEF_ARN=$ARN" >> $GITHUB_OUTPUT
          echo "Registered: $ARN"

      - name: Render AppSpec (YAML revision)
        run: |
          cat > appspec.rendered.yaml << EOF
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: "${{ steps.register.outputs.TASKDEF_ARN }}"
                  LoadBalancerInfo:
                    ContainerName: "app"
                    ContainerPort: 3000
          EOF

      - name: Upload AppSpec to S3
        run: |
          KEY="appspec-${GITHUB_SHA}.yaml"
          aws s3 cp appspec.rendered.yaml s3://${CODEDEPLOY_BUCKET}/${KEY} --region ${AWS_REGION}
          echo "REV_KEY=${KEY}" >> $GITHUB_ENV

      - name: Create CodeDeploy deployment
        id: cd
        run: |
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "${CODEDEPLOY_APP}" \
            --deployment-group-name "${CODEDEPLOY_DG}" \
            --revision "revisionType=S3,s3Location={bucket=${CODEDEPLOY_BUCKET},key=${REV_KEY},bundleType=YAML}" \
            --region ${AWS_REGION} \
            --query "deploymentId" --output text)
          echo "DEPLOYMENT_ID=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deployment: $DEPLOY_ID"

      - name: Wait for CodeDeploy to finish
        run: |
          ID="${{ steps.cd.outputs.DEPLOYMENT_ID }}"
          for i in {1..60}; do
            STATUS=$(aws deploy get-deployment \
              --deployment-id "$ID" \
              --region ${AWS_REGION} \
              --query "deploymentInfo.status" \
              --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              aws deploy get-deployment \
                --deployment-id "$ID" \
                --region ${AWS_REGION} \
                --query "deploymentInfo.errorInformation" \
                --output table || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment"
          exit 1

      - name: Smoke test (ALB)
        run: |
          curl -sSf ${ALB_BASE_URL}/health
          curl -sSf ${ALB_BASE_URL}/version
